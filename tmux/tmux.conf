# set true colors
set-option -sa terminal-overrides ",xterm*:Tc"
set -g escape-time 10
set -as terminal-features ",xterm-256color:extkeys"

set -g mouse on
set -g status-interval 5
set -g bell-action none
set -g visual-bell off

# Start Windows and Panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Sort sessions alphabetically in Ctrl+b s
bind s choose-tree -sZ -O name

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "slanted"
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'         # auto-restore on tmux start
set -g @resurrect-strategy-nvim 'session'  # restore neovim sessions too
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'Peter-McKinney/tmux-fzf-open-files-nvim'
set -g @pomodoro_start 'p'
set -g @pomodoro_cancel 'P'
set -g @pomodoro_mins 10
set -g @pomodoro_break_mins 5
set -g @pomodoro_notifications 'on'

set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# set vi mode
set-window-option -g mode-keys vi

# tmux-yank settings
set -g @yank_selection 'clipboard'
set -g @yank_action 'copy-pipe-and-cancel'

# Smart pane navigation with fallback wrapping
bind-key Up if-shell '[ #{pane_at_top} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 1"' 'select-pane -U'
bind-key Down if-shell '[ #{pane_at_bottom} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 2"' 'select-pane -D'
bind-key Left select-pane -L
bind-key Right select-pane -R

# Vim-style pane navigation
bind-key k if-shell '[ #{pane_at_top} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 1"' 'select-pane -U'
bind-key j if-shell '[ #{pane_at_bottom} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 2"' 'select-pane -D'
bind-key h select-pane -L
bind-key l select-pane -R

# Key Bindings
bind-key / copy-mode \; send-keys '/'
bind-key K confirm-before -p "Clear scrollback history? (y/n)" "send-keys 'clear' Enter ; run 'sleep 0.1' ; clear-history"

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind ] paste-buffer -p

set -g @catppuccin_application_icon " "
set -g @catppuccin_application_color "#{@thm_peach}"
set -g @catppuccin_application_text "#{pane_current_command}"

# Status bar (set before run so pomodoro plugin can interpolate #{pomodoro_status};
# #{@thm_*} variables are evaluated lazily at render time so catppuccin colors still work)
set -g status-left-length 160
set -g status-left '#{pomodoro_status} #[fg=#{@thm_sapphire},bg=#{@thm_surface_0}] #(date "+%a %H:%M") #{E:@catppuccin_status_session} #[fg=#{@thm_green}] #(cd #{pane_current_path} && git branch --show-current 2>/dev/null) #[fg=#{@thm_blue}] CPU:#(top -l 1 | grep "CPU usage" | awk "{print \$3}") #[fg=#{@thm_teal}] #(docker ps -q 2>/dev/null | wc -l | tr -d " ")containers'

# Scroll position in copy mode
set -g status-right-length 80
set -g status-right '#{?pane_in_mode,#[fg=yellow,bold] #{scroll_position}/#{history_size}  #{e|*|f0:#{e|/|f2:#{scroll_position},#{history_size}},100}%%,}'

run '~/.tmux/plugins/tpm/tpm'

# Active pane highlight
set -g pane-border-style 'fg=#6e738d'
set -g pane-active-border-style 'fg=#f9e2af,bold'
set -g pane-border-status top
set -g pane-border-format ' #{pane_current_command}  #{pane_current_path} '
