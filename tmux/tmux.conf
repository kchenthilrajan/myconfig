# set true colors
set-option -sa terminal-overrides ",xterm*:Tc"
set -g escape-time 10
set -as terminal-features ",xterm-256color:extkeys"

set -g mouse on
set -g bell-action none
set -g visual-bell off

# Start Windows and Panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Sort sessions alphabetically in Ctrl+b s
bind s choose-tree -sZ -O name

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "slanted"
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'         # auto-restore on tmux start
set -g @resurrect-strategy-nvim 'session'  # restore neovim sessions too

set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# set vi mode
set-window-option -g mode-keys vi

# tmux-yank settings
set -g @yank_selection 'clipboard'
set -g @yank_action 'copy-pipe-and-cancel'

# Smart pane navigation with fallback wrapping
bind-key Up if-shell '[ #{pane_at_top} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 1"' 'select-pane -U'
bind-key Down if-shell '[ #{pane_at_bottom} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 2"' 'select-pane -D'
bind-key Left select-pane -L
bind-key Right select-pane -R

# Vim-style pane navigation
bind-key k if-shell '[ #{pane_at_top} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 1"' 'select-pane -U'
bind-key j if-shell '[ #{pane_at_bottom} -eq 1 ]' 'run-shell "tmux select-pane -L && tmux select-pane -t 2"' 'select-pane -D'
bind-key h select-pane -L
bind-key l select-pane -R

# Key Bindings
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind ] paste-buffer -p

set -g @catppuccin_application_icon " "
set -g @catppuccin_application_color "#{@thm_peach}"
set -g @catppuccin_application_text "#{pane_current_command}"

run '~/.tmux/plugins/tpm/tpm'

# Active pane highlight
set -g pane-border-style 'fg=#6e738d'
set -g pane-active-border-style 'fg=#f9e2af,bold'
set -g pane-border-status top
set -g pane-border-format ' #{pane_current_command} '

# High contrast selection highlight
set -g mode-style 'fg=black,bg=yellow,bold'

# Status bar - must come AFTER run so catppuccin colors are available
set -g status-left-length 100
set -g status-left '#[fg=#{@thm_sapphire},bg=#{@thm_surface_0}] #(date "+%a %H:%M") #{E:@catppuccin_status_application} #{E:@catppuccin_status_user} #{E:@catppuccin_status_directory}'
